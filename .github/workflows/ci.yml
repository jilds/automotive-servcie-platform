# Build and test every push and pull request; scan the dependencies and the image; push the image to GHCR only for a
# version tag (v1.2.3 -> ghcr.io/jilds/asp:1.2.3), from its own job, after every check passed. A weekly run re-scans
# main for new CVEs. Third-party actions are pinned by commit and images by digest (Dependabot updates them).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/jilds/asp
  TRIVY: aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      # Frontend tests and build, backend tests (Testcontainers uses the runner's Docker), architecture rules.
      - run: ./mvnw -B -ntp clean verify
      - name: Keep the test reports of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # The landing site (site/, step 03): not in the Maven reactor; Astro type check and static build. The release image
  # does not depend on it.
  site:
    name: Landing site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # npm lock file and Maven poms; HIGH and CRITICAL findings with a fix available fail the job.
      - run: >-
          docker run --rm -v "$PWD:/src:ro" "$TRIVY" fs --scanners vuln --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 --skip-dirs /src/frontend/node_modules /src

  image:
    name: Image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker build --label "org.opencontainers.image.revision=$REVISION" -t "$IMAGE:ci" .
          docker save "$IMAGE:ci" -o image.tar
      # The image's OS packages and the libraries inside the jar (micrometer-registry-prometheus among them).
      - name: Scan
        run: >-
          docker run --rm -v "$PWD/image.tar:/image.tar:ro" "$TRIVY" image --input /image.tar
          --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - name: Hand the scanned image to the release job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
          retention-days: 1

  release:
    name: Push the release image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, dependencies, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Add required reviewers to this environment in the repository settings (docs/release/checklist.md).
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Push
        env:
          TAG: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Not a version tag: $TAG"; exit 1; }
          docker load -i image.tar
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          # A release is never overwritten.
          if docker manifest inspect "$IMAGE:$version" > /dev/null 2>&1; then
            echo "$IMAGE:$version exists already"; exit 1
          fi
          docker tag "$IMAGE:ci" "$IMAGE:$version"
          docker push "$IMAGE:$version"
          echo "Pushed $(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$version")" >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
