# Weekly update pull requests; minor and patch updates grouped per ecosystem, majors one by one.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site-minor:
        update-types: [minor, patch]
