# Production on one server: Caddy (TLS) -> app -> PostgreSQL. See docs/release/runbook.md.
#   cp deploy/env.example deploy/.env   # then fill it in
#   docker compose -f deploy/compose.prod.yaml --env-file deploy/.env up -d --wait
# Only Caddy publishes ports. The app (8080) and its management port (8081) stay on internal networks, and the app
# trusts X-Forwarded-For only from Caddy's fixed address, so nobody can fake a client address past the rate limits.
# Images are pinned by digest; Dependabot (docker-compose) proposes updates.
name: asp

# Rotated logs, so a log flood cannot fill the disk.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  caddy:
    image: caddy:2.11-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    # IPv4 only for now: publish no AAAA record until the edge network has IPv6 (runbook §1), or every IPv6 client
    # would reach Caddy as one address and share one rate-limit bucket.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ASP_APP_DOMAIN: ${ASP_APP_DOMAIN:?set ASP_APP_DOMAIN, for example app.asp.example}
      ASP_SITE_DOMAIN: ${ASP_SITE_DOMAIN:?set ASP_SITE_DOMAIN, for example asp.example}
      ASP_ACME_EMAIL: ${ASP_ACME_EMAIL:?set ASP_ACME_EMAIL, where Let's Encrypt sends expiry notices}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy:/etc/caddy/caddy:ro
      # The built landing site (runbook §2); the placeholder in deploy/site until it is deployed.
      - ${ASP_SITE_DIR:-./site}:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
      proxy:
        ipv4_address: 172.30.0.10
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    depends_on:
      app:
        condition: service_healthy

  app:
    image: ${ASP_IMAGE:?set ASP_IMAGE, for example ghcr.io/jilds/asp:1.0.0}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ASP_DB_URL: jdbc:postgresql://db:5432/asp
      ASP_DB_APP_USER: asp_app
      ASP_DB_APP_PASSWORD: ${ASP_DB_APP_PASSWORD:?set ASP_DB_APP_PASSWORD}
      ASP_DB_OWNER_USER: asp_owner
      ASP_DB_OWNER_PASSWORD: ${ASP_DB_OWNER_PASSWORD:?set ASP_DB_OWNER_PASSWORD}
      ASP_JWT_SECRET: ${ASP_JWT_SECRET:?set ASP_JWT_SECRET, at least 32 random bytes}
      ASP_PUBLIC_URL: https://${ASP_APP_DOMAIN}
      # The site's origin may post the demo request form (CORS); its privacy page is linked from the booking page.
      ASP_SITE_ORIGIN: ${ASP_SITE_ORIGIN:-https://${ASP_SITE_DOMAIN}}
      ASP_SITE_PRIVACY_URL: ${ASP_SITE_PRIVACY_URL:-}
      # Exactly Caddy's address on the proxy network (see caddy.networks).
      ASP_TRUSTED_PROXIES: '172\.30\.0\.10'
      ASP_MAIL_ENABLED: ${ASP_MAIL_ENABLED:-false}
      ASP_MAIL_HOST: ${ASP_MAIL_HOST:-}
      ASP_MAIL_PORT: ${ASP_MAIL_PORT:-587}
      ASP_MAIL_USERNAME: ${ASP_MAIL_USERNAME:-}
      ASP_MAIL_PASSWORD: ${ASP_MAIL_PASSWORD:-}
      ASP_MAIL_FROM: ${ASP_MAIL_FROM:-}
      ASP_MAIL_SMTP_AUTH: ${ASP_MAIL_SMTP_AUTH:-true}
      ASP_MAIL_STARTTLS_REQUIRED: ${ASP_MAIL_STARTTLS_REQUIRED:-true}
      ASP_SUBSCRIPTION_GRACE_DAYS: ${ASP_SUBSCRIPTION_GRACE_DAYS:-7}
      ASP_SITE_LEADS_PER_HOUR: ${ASP_SITE_LEADS_PER_HOUR:-50}
      # Only for the first start; remove them once the first platform admin exists.
      ASP_BOOTSTRAP_ADMIN_EMAIL: ${ASP_BOOTSTRAP_ADMIN_EMAIL:-}
      ASP_BOOTSTRAP_ADMIN_PASSWORD: ${ASP_BOOTSTRAP_ADMIN_PASSWORD:-}
      ASP_BOOTSTRAP_ADMIN_NAME: ${ASP_BOOTSTRAP_ADMIN_NAME:-}
    # proxy: from Caddy. data: to the database. outbound: SMTP. No ports are published on any of them.
    networks:
      - proxy
      - data
      - outbound
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    restart: unless-stopped
    environment:
      POSTGRES_DB: asp
      POSTGRES_USER: asp_admin
      POSTGRES_PASSWORD: ${ASP_DB_ADMIN_PASSWORD:?set ASP_DB_ADMIN_PASSWORD}
      # Read by init.sh on the first start only, to create the two roles the app uses.
      ASP_DB_OWNER_PASSWORD: ${ASP_DB_OWNER_PASSWORD}
      ASP_DB_APP_PASSWORD: ${ASP_DB_APP_PASSWORD}
    volumes:
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - db-data:/var/lib/postgresql
    networks:
      - data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U asp_admin -d asp" ]
      interval: 5s
      retries: 10
    shm_size: 256mb
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # Off-site copy of a dump, run by deploy/backup.sh only (profile "backup"); the keys come from .env, never argv.
  backup-upload:
    image: amazon/aws-cli:2.31.20@sha256:75b6502a9b1192cb9ea97d04bc1a93eda62a38f95235694d53a3f40307c27197
    profiles: [backup]
    environment:
      AWS_ACCESS_KEY_ID: ${ASP_BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${ASP_BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${ASP_BACKUP_S3_REGION:-eu-central-1}
    volumes:
      - ${ASP_BACKUP_DIR:-/var/backups/asp}:/backups:ro
    networks:
      - outbound
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

networks:
  edge:
  outbound:
  # Caddy -> app. No route out. Caddy's fixed address lies outside the range Docker hands out.
  proxy:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25
  # app -> database only; Caddy is not on it.
  data:
    internal: true

volumes:
  db-data:
  caddy-data:
  caddy-config:
