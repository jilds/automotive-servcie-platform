spring:
  application:
    name: asp
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ASP_DB_URL:jdbc:postgresql://localhost:5432/asp}
    username: ${ASP_DB_APP_USER:asp_app}
    password: ${ASP_DB_APP_PASSWORD:asp_app}
  flyway:
    user: ${ASP_DB_OWNER_USER:asp_owner}
    password: ${ASP_DB_OWNER_PASSWORD:asp_owner}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  # spring-boot-docker-compose picks up compose.yaml from the working directory, which is the
  # repository root both in the IDE and for spring-boot:run (see backend/pom.xml)

app:
  security:
    jwt-secret: ${ASP_JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes!!}
  identity:
    token:
      issuer: asp
      ttl: 12h

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    git:
      mode: simple

springdoc:
  swagger-ui:
    path: /swagger-ui.html
