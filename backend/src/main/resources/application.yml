spring:
  application:
    name: ASP - Automotive Service Platform
  threads:
    virtual:
      enabled: true
  # The @Async executor (mails after the commit): at most 16 at once, so SMTP connections stay bounded, and a
  # shutdown waits for the mails still being sent.
  task:
    execution:
      simple:
        concurrency-limit: 16
      shutdown:
        await-termination: true
        await-termination-period: 20s
  datasource:
    url: ${ASP_DB_URL:jdbc:postgresql://localhost:5432/asp}
    username: ${ASP_DB_APP_USER:asp_app}
    password: ${ASP_DB_APP_PASSWORD:asp_app}
  flyway:
    user: ${ASP_DB_OWNER_USER:asp_owner}
    password: ${ASP_DB_OWNER_PASSWORD:asp_owner}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  # spring-boot-docker-compose picks up compose.yaml from the working directory, which is the
  # repository root both in the IDE and for spring-boot:run (see backend/pom.xml)

app:
  security:
    # No fallback here: a run without the dev profile (application-dev.yml) and without ASP_JWT_SECRET stops at
    # startup instead of signing tokens with a secret anyone can read in this repository.
    jwt-secret: ${ASP_JWT_SECRET:}
  identity:
    token:
      issuer: asp
      ttl: 12h
  # Workshops do not sign up themselves: the platform owner registers them (ADR 0003).
  platform:
    # "Want ASP for your workshop?" block on the login page; hidden while both are empty.
    contact-email: ${ASP_CONTACT_EMAIL:}
    contact-phone: ${ASP_CONTACT_PHONE:}
    # First platform admin, created at startup only while none exists. Set both through the environment,
    # never in this file; the password needs 12 to 72 characters. Remove them after the first start.
    bootstrap-admin-email: ${ASP_BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${ASP_BOOTSTRAP_ADMIN_PASSWORD:}
    bootstrap-admin-name: ${ASP_BOOTSTRAP_ADMIN_NAME:}
  # Where people open the app, for the absolute links in mails (required while mail is on).
  public-url: ${ASP_PUBLIC_URL:}
  # E-mail (module notification). Off by default: nothing is sent and the links stay on screen. The SMTP server is
  # spring.mail.* below.
  mail:
    enabled: ${ASP_MAIL_ENABLED:false}
    from: ${ASP_MAIL_FROM:}
  # After subscription_until a workshop keeps working for these days, then it is locked out like a suspended one.
  subscription:
    grace-days: ${ASP_SUBSCRIPTION_GRACE_DAYS:7}
  # Public workshop pages /api/v1/public/{slug}/... (ADR 0004): lookups per client address across all slugs
  # (checked before the slug is looked up), then reads and writes per client address and workshop.
  # The prod profile reads the client's address from X-Forwarded-For sent by a trusted proxy (application-prod.yml).
  public:
    rate-limit:
      lookups:
        limit: 120
        window: 1m
      writes:
        limit: 10
        window: 1h
      reads:
        limit: 120
        window: 1m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # /actuator/health/liveness and /actuator/health/readiness for the container platform
      probes:
        enabled: true
  info:
    git:
      mode: simple

springdoc:
  swagger-ui:
    path: /swagger-ui.html
