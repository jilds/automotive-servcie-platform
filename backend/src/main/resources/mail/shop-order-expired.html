<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.toLanguageTag()}">
<head>
  <meta charset="utf-8">
  <title th:text="#{shop-order-expired.subject(${workshop}, ${number})}">Subject</title>
</head>
<body style="margin:0;padding:16px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1c1f23;line-height:1.5">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:24px">
    <p th:text="#{mail.greeting(${name})}">Hello</p>
    <p style="font-weight:bold" th:text="#{shop-order-expired.body(${workshop}, ${number}, ${until})}">Body</p>
    <hr style="border:none;border-top:1px solid #dee2e6;margin:24px 0">
    <p style="font-size:12px;color:#6c757d" th:text="#{mail.automatic}">Automatic</p>
  </div>
</body>
</html>
