<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.toLanguageTag()}">
<head>
  <meta charset="utf-8">
  <title th:text="#{booking-received.subject(${workshop}, ${number})}">Subject</title>
</head>
<body style="margin:0;padding:16px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1c1f23;line-height:1.5">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:24px">
    <p th:text="#{mail.greeting(${name})}">Hello</p>
    <p th:text="#{booking-received.body(${workshop}, ${number}, ${when})}">Body</p>
    <p style="margin:24px 0">
      <a th:href="${link}" th:text="#{booking-received.action}"
         style="display:inline-block;background:#f2b200;color:#1c1f23;text-decoration:none;font-weight:bold;padding:12px 20px;border-radius:6px">Action</a>
    </p>
    <p style="font-size:13px;word-break:break-all;color:#495057" th:text="${link}">link</p>
    <p th:text="#{booking-received.keep}">Keep</p>
    <hr style="border:none;border-top:1px solid #dee2e6;margin:24px 0">
    <p style="font-size:12px;color:#6c757d" th:text="#{mail.automatic}">Automatic</p>
  </div>
</body>
</html>
