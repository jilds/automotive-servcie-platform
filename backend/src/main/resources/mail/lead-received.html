<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.toLanguageTag()}">
<head>
  <meta charset="utf-8">
  <title th:text="#{lead-received.subject(${workshop})}">Subject</title>
</head>
<body style="margin:0;padding:16px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1c1f23;line-height:1.5">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:24px">
    <p style="font-weight:bold" th:text="#{lead-received.body}">Body</p>
    <table style="border-collapse:collapse;width:100%;font-size:14px">
      <tr><td style="padding:4px 8px 4px 0;color:#6c757d" th:text="#{lead-received.name}">Name</td><td th:text="${name}">x</td></tr>
      <tr><td style="padding:4px 8px 4px 0;color:#6c757d" th:text="#{lead-received.workshop}">Workshop</td><td th:text="${workshop}">x</td></tr>
      <tr th:if="${phone != ''}"><td style="padding:4px 8px 4px 0;color:#6c757d" th:text="#{lead-received.phone}">Phone</td><td th:text="${phone}">x</td></tr>
      <tr th:if="${email != ''}"><td style="padding:4px 8px 4px 0;color:#6c757d" th:text="#{lead-received.email}">E-mail</td><td style="word-break:break-all" th:text="${email}">x</td></tr>
      <tr th:if="${district != ''}"><td style="padding:4px 8px 4px 0;color:#6c757d" th:text="#{lead-received.district}">District</td><td th:text="${district}">x</td></tr>
      <tr><td style="padding:4px 8px 4px 0;color:#6c757d" th:text="#{lead-received.vehicleType}">Type</td><td th:text="#{${'lead.type.' + vehicleType}}">x</td></tr>
    </table>
    <p th:if="${hasMessage}" style="border-left:3px solid #dee2e6;padding-left:12px" th:text="#{lead-received.message}">Message</p>
    <p style="margin:24px 0">
      <a th:href="${link}" th:text="#{lead-received.action}"
         style="display:inline-block;background:#f2b200;color:#1c1f23;text-decoration:none;font-weight:bold;padding:12px 20px;border-radius:6px">Action</a>
    </p>
    <hr style="border:none;border-top:1px solid #dee2e6;margin:24px 0">
    <p style="font-size:12px;color:#6c757d" th:text="#{mail.automatic}">Automatic</p>
  </div>
</body>
</html>
